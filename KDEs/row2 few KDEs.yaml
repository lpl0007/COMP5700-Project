def generate_structured_report(data):
    result = {}
    for element in data:
        if isinstance(element, str):
            result[element] = element
        else:
            try:
                result[element] = int(element)
            except ValueError:
                print("Could not convert", element, "to integer.")
    return result

# Example usage
