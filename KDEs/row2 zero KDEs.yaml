def analyze_data(df):
    # Basic statistics
    print("Basic Statistics:")
    print(df.describe())
    return df
def count_elements(df):
    # Count occurrences of elements
    counts = {}
    for element in df.index:
        if element in counts:
            counts[element]+=1
        else:
            counts[element]=1
    print("\nElement Counts:\n", counts)
    return counts
